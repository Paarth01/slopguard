[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "0.1.0"
description = "Security scanner for AI-generated code: hallucinated dependencies, unsafe patterns, and intent drift."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Paarth Agl" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "requests>=2.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-mock>=3.14", "httpx>=0.27", "ruff>=0.7", "black>=24.10", "mypy>=1.13"]

[project.scripts]
slopguard = "slopguard.cli:main"

[tool.setuptools]
packages = ["slopguard", "action"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
