name: "SlopGuard"
description: "Security scanner for AI-generated code: catches hallucinated dependencies, unsafe patterns, and intent drift."
author: "Paarth Agl"

inputs:
  path:
    description: "Path to scan (default: repo root)"
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the build: critical | high | medium | low"
    required: false
    default: "high"

runs:
  using: "docker"
  # Points at the root Dockerfile (already correct, already proven working
  # for the Render deploy) rather than action/Dockerfile. A real build log
  # confirmed GitHub uses the *Dockerfile's own directory* as the build
  # context, not the directory action.yml lives in -- so a Dockerfile
  # inside action/ can never COPY files that live at the repo root (fs,
  # templates/, pyproject.toml, etc). Reusing the root Dockerfile avoids
  # that entirely, since its build context is the repo root, where
  # everything it needs already lives.
  image: "Dockerfile"
  entrypoint: "action/entrypoint.sh"
  env:
    INPUT_PATH: ${{ inputs.path }}
    INPUT_FAIL_ON: ${{ inputs.fail-on }}

branding:
  icon: "shield"
  color: "purple"
