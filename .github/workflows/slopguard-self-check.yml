name: SlopGuard Self-Check
on:
  pull_request:
    branches: [main]

jobs:
  slopguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./               # points at this repo's own action.yml
        with:
          path: .
          fail-on: critical
