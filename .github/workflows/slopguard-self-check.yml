name: SlopGuard Self-Check

on:
  pull_request:
    branches: [main]

jobs:
  slopguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SlopGuard
        uses: ./
        with:
          path: .
          fail-on: critical
          exclude: tests/fixtures/
          github-token: ${{ secrets.GITHUB_TOKEN }}
